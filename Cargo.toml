[package]
name = "atlascode-inteligence"
version = "0.1.0"
edition = "2021"
authors = ["Aditya Pratap Singh <adsingh@zetaglobal.com>"]
description = "A local-first Model Context Protocol (MCP) server for reusable workflows and resolved engineering knowledge"
license = "MIT"
repository = "https://github.com/adityaiitg/AtlasCodeInteligence"
homepage = "https://github.com/adityaiitg/AtlasCodeInteligence"
documentation = "https://docs.rs/atlascode-inteligence"
readme = "README.md"
keywords = ["mcp", "ai-agents", "vector-search", "sqlite", "simd"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "atlascode_inteligence"
path = "src/lib.rs"

[[bin]]
name = "atlascode-inteligence-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "6.0"
half = "2.7"
hf-hub = { version = "0.5", features = ["tokio"] }
regex = "1.13.1"
rusqlite = { version = "0.31", features = ["bundled-full"] }
safetensors = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.20"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
