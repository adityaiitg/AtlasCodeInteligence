[package]
name = "atlascode-inteligence"
version = "0.1.0"
edition = "2021"
description = "A local-first MCP server for reusable workflows and resolved engineering knowledge"

[[bin]]
name = "atlascode-inteligence-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
half = "2.7"
hf-hub = { version = "0.5", features = ["tokio"] }
rusqlite = { version = "0.31", features = ["bundled-full"] }
safetensors = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
